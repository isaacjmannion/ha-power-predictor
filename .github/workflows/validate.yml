name: Validate

# CI: runs on every push/PR to main, once a day on a schedule (to catch
# breaking changes in the upstream HACS/hassfest validators even when we
# aren't committing), and on demand via the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    # Home Assistant's official validator for the integration manifest.
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # Checks the repository is correctly structured for HACS distribution.
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # We are not registered in the Home Assistant brands repo, so skip
          # that specific check (icons ship in the integration's brand/ folder).
          ignore: brands

  dev-fork-sync:
    # The committed dev A/B fork (dist/ha_power_predictor_dev) is a domain-renamed
    # copy of the integration. This fails if someone changed the integration
    # without regenerating the fork — run `python tools/build_dev_fork.py` to fix.
    # Stdlib only, so no dependencies to install.
    name: Dev fork in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check dev fork is up to date with source
        run: python tools/build_dev_fork.py --check
